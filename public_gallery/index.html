<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Gallery — Community Fonts</title>
  <meta name="description" content="Community fonts you can download." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;700&family=Noto+Sans+Thai:wght@400;500;700&family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <button class="back-btn" aria-label="Back to app">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <div class="header-text">
        <h1>Public Gallery</h1>
        <p>Community fonts you can download</p>
      </div>
    </header>

    <nav class="filters" aria-label="Font filters">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="burmese">Burmese</button>
      <button class="filter-chip" data-filter="latin">Latin</button>
      <button class="filter-chip" data-filter="thai">Thai</button>
    </nav>

    <main class="gallery" id="gallery"></main>
  </div>

  <script src="script.js"></script>
</body>
</html>
